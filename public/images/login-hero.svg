<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo profesional -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d40" />
      <stop offset="50%" stop-color="#031882" />
      <stop offset="100%" stop-color="#0a2540" />
    </linearGradient>

    <!-- Gradiente para detalles brillantes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Patrón de red / circuitos -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="500" fill="url(#bgGrad)" />
  <rect width="600" height="500" fill="url(#grid)" />

  <!-- Iluminación ambiental posterior -->
  <circle cx="300" cy="250" r="180" fill="#00f2fe" opacity="0.08" filter="blur(40px)" />

  <!-- ILUSTRACIÓN DE HARDWARE Y PRODUCTOS INFORMÁTICOS -->
  <g transform="translate(100, 80)">
    
    <!-- Servidor / Rack en perspectiva posterior -->
    <rect x="230" y="40" width="120" height="220" rx="6" fill="#0d1b2a" stroke="#1b2a4a" stroke-width="2" />
    <line x1="240" y1="70" x2="340" y2="70" stroke="#1b2a4a" stroke-width="2" />
    <line x1="240" y1="100" x2="340" y2="100" stroke="#1b2a4a" stroke-width="2" />
    <line x1="240" y1="130" x2="340" y2="130" stroke="#1b2a4a" stroke-width="2" />
    <line x1="240" y1="160" x2="340" y2="160" stroke="#1b2a4a" stroke-width="2" />
    
    <!-- LEDs de actividad en servidor -->
    <circle cx="250" cy="55" r="3" fill="#00f2fe" />
    <circle cx="260" cy="55" r="3" fill="#10b981" />
    <circle cx="250" cy="85" r="3" fill="#00f2fe" />
    <circle cx="250" cy="115" r="3" fill="#3b82f6" />
    <circle cx="250" cy="145" r="3" fill="#10b981" />

    <!-- Monitor Principal -->
    <rect x="50" y="60" width="220" height="140" rx="8" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
    <!-- Peana Monitor -->
    <path d="M 140 200 L 180 200 L 185 230 L 135 230 Z" fill="#1e293b" />
    <rect x="120" y="230" width="80" height="6" rx="2" fill="#334155" />

    <!-- Pantalla: Código / Dashboard Informático -->
    <rect x="60" y="70" width="200" height="120" rx="4" fill="#020617" />
    <!-- Líneas de datos en pantalla -->
    <rect x="70" y="82" width="60" height="6" rx="2" fill="#00f2fe" opacity="0.8" />
    <rect x="135" y="82" width="40" height="6" rx="2" fill="#3b82f6" opacity="0.5" />
    
    <rect x="70" y="98" width="100" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
    <rect x="70" y="108" width="140" height="4" rx="2" fill="#94a3b8" opacity="0.3" />
    <rect x="70" y="118" width="80" height="4" rx="2" fill="#94a3b8" opacity="0.4" />
    
    <rect x="70" y="135" width="45" height="25" rx="3" fill="#1e293b" />
    <rect x="122" y="135" width="45" height="25" rx="3" fill="#1e293b" />
    <rect x="174" y="135" width="45" height="25" rx="3" fill="#1e293b" />
    <circle cx="92" cy="147" r="6" fill="#10b981" opacity="0.8" />
    <circle cx="144" cy="147" r="6" fill="#00f2fe" opacity="0.8" />
    <circle cx="196" cy="147" r="6" fill="#f59e0b" opacity="0.8" />

    <!-- Laptop Abierto en Primer Plano -->
    <path d="M 10 210 L 110 210 L 120 275 L 0 275 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <path d="M 0 275 L 120 275 L 130 282 L -10 282 Z" fill="#0f172a" />
    <!-- Teclado retroiluminado -->
    <rect x="15" y="220" width="90" height="45" rx="2" fill="#020617" />
    <line x1="20" y1="230" x2="100" y2="230" stroke="#00f2fe" stroke-width="1" opacity="0.6" stroke-dasharray="4,2" />
    <line x1="20" y1="240" x2="100" y2="240" stroke="#00f2fe" stroke-width="1" opacity="0.6" stroke-dasharray="3,2" />
    <line x1="20" y1="250" x2="100" y2="250" stroke="#00f2fe" stroke-width="1" opacity="0.6" stroke-dasharray="5,2" />

    <!-- Componente RAM / Chip (Conexión flotante) -->
    <g transform="translate(260, 200)">
      <rect x="0" y="0" width="70" height="40" rx="4" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5" />
      <circle cx="35" cy="20" r="10" fill="none" stroke="#00f2fe" stroke-width="1.5" />
      <path d="M 35 15 L 35 25 M 30 20 L 40 20" stroke="#00f2fe" stroke-width="1.5" />
      <line x1="10" y1="35" x2="60" y2="35" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2,2" />
    </g>

    <!-- Ondas de conexión / Cloud -->
    <path d="M 160 50 Q 200 20 240 40" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4,4" opacity="0.7" />
  </g>

  <!-- Texto superpuesto inferior sutil -->
  <text x="300" y="440" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="300" letter-spacing="2" opacity="0.7">
    HARDWARE &amp; INFRAESTRUCTURA TI
  </text>
</svg>
